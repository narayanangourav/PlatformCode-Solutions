name: Release LeetCode Sync

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  install-dependencies:
    if: startsWith(github.ref_name, 'v')
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

  test-sync-script:
    needs: install-dependencies
    if: needs.install-dependencies.result == 'success'
    name: Test sync script
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-release-container:
    needs: test-sync-script
    if: needs.test-sync-script.result == 'success'
    name: Build and publish release container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish public release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          PACKAGE_NAME="${REPOSITORY_NAME,,}-release"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PACKAGE_NAME}"

          docker build \
            --file Containerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:latest" \
            .
          docker push --all-tags "${IMAGE}"

  publish-release:
    needs: build-release-container
    if: needs.build-release-container.result == 'success'
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Create source bundle
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output="dist/leetcode-sync-${{ github.ref_name }}.zip" \
            "${{ github.sha }}" \
            -- \
            .containerignore \
            .env.example \
            Containerfile \
            LICENSE \
            README.md \
            compose.yaml \
            requirements.txt \
            scripts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --generate-notes \
              --title "LeetCode Sync ${{ github.ref_name }}"
          fi
          gh release upload "${{ github.ref_name }}" "dist/leetcode-sync-${{ github.ref_name }}.zip" --clobber
