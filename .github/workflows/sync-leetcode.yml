name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  push:
  schedule:
    # GitHub Actions schedules use UTC: 18:30 UTC is 00:00 IST on the following day.
    - cron: "30 18 1,10,20,30 * *"

permissions:
  contents: write

jobs:
  install-dependencies:
    if: github.event_name != 'schedule' || vars.LEETCODE_SYNC_CRON_DISABLED != 'true'
    name: Install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

  test-sync-script:
    needs: install-dependencies
    if: needs.install-dependencies.result == 'success'
    name: Test sync script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Test sync script
        run: python -m unittest discover -s tests -v

  build-container:
    needs: test-sync-script
    if: needs.test-sync-script.result == 'success'
    name: Build and publish sync container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish public sync image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          PACKAGE_NAME="${REPOSITORY_NAME,,}-sync"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PACKAGE_NAME}"

          docker build \
            --file Containerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" \
            .
          docker push --all-tags "${IMAGE}"

  sync-leetcode:
    needs: build-container
    if: needs.build-container.result == 'success'
    name: Pull accepted LeetCode solutions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Pull accepted LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync_leetcode.py

      - name: Commit synchronized solutions
        run: |
          git add leetcode-solutions

          if git diff --cached --quiet; then
            echo "No new solutions found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync LeetCode solutions"
          git push
