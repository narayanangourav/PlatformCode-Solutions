name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  push:
  schedule:
    # GitHub Actions schedules use UTC: Saturday 18:30 UTC is Sunday 00:00 IST.
    - cron: "30 18 * * 6"

permissions:
  contents: write

jobs:
  test-sync-script:
    if: github.event_name != 'schedule' || vars.LEETCODE_SYNC_CRON_DISABLED != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Test sync script
        run: python -m unittest discover -s tests -v

  sync-leetcode:
    needs: test-sync-script
    if: github.event_name != 'schedule' || vars.LEETCODE_SYNC_CRON_DISABLED != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync_leetcode.py

      - name: Commit synchronized solutions
        run: |
          git add leetcode-solutions

          if git diff --cached --quiet; then
            echo "No new solutions found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync LeetCode solutions"
          git push
